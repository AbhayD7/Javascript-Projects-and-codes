<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Love Calculator❤️</h1>
  <div id="parent">
  <form action="">
  <div class="name">
  <label for="boy">Boy Name</label>
  <br>
  <input type="text" name="" id="boy" required pattern="[A-Z a-z]+">
  </div>
  <div class="name">
    <label for="girl">Girl Name</label>
    <br>
  <input type="text" name="" id="girl" required pattern="[A-Z a-z]+">
  </div>
  <input type="submit" value="Calculate" id="result">
  </form>
  </div>
  <h2 class="lovePercent"></h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
