<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="color: white; background-color: rgb(29, 29, 29)";>
    <ul class="language">
        <li>JavaScript</li>

    </ul>
    
</body>
<script>
    function addLang(lang){
        const li=document.createElement('li');
        li.innerHTML=lang
        document.querySelector('.language').appendChild(li)
    }
    addLang("python")
    addLang("Java")

    //Creating list in an optimized way
    function addLangOpt(lang){
        const li=document.createElement('li')
       li.appendChild(document.createTextNode(lang)) 
       document.querySelector('.language').appendChild(li)
    }
    addLangOpt("Ruby")

     //Edit
    const secondLang=document.querySelector("li:nth-child(2)")
    const newLi=document.createElement('li')
    newLi.textContent="Mojo"
    secondLang.replaceWith(newLi)

    //Edit
    const firstLang=document.querySelector("li:nth-child(1)")
    const firstLi=document.createElement('li')
    firstLi.textContent="TypeScript"
    firstLang.replaceWith(firstLi)

    //edit
    const firstLg=document.querySelector("li:first-child")
    firstLg.outerHTML='<li>Android</li>'

    //to remove 
    const lastLang=document.querySelector("li:last-child")
    lastLang.remove();
</script>
</html>
